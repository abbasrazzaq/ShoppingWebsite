# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - master
      - develop

pool:
  name: Default
  demands:
    - agent.name -equals ABBAS-THINKPAD

variables:
  buildConfiguration: 'Release'
  nodeVersion: '20.x'
  dotnetVersion: '8.0.x'

  # Container settings
  registryName: shoppingwebsiteacr
  imageName: shoppingwebsite
  containerAppName: shoppingwebsite-app
  resourceGroup: azuregroup1
  containerEnv: shoppingwebsite-env

  # Key Vault settings
  vaultName: ShoppingWebsiteSqlConn
  secretName: shoppingwebsite-sqlconnectionstring

stages:

# -------------------------------------------------------------
# 1. Build the Frontend (Vite) and Backend (ASP.NET + DACPAC)
# -------------------------------------------------------------
- stage: Build
  displayName: 'Build & Publish ShoppingWebsite'
  jobs:

  - job: Build_Frontend
    displayName: 'Build ShoppingWebsite.client (Vite)'
    steps:
    - checkout: self
  
    - task: NodeTool@0
      inputs:
        versionSpec: '$(nodeVersion)'

    - script: |
        echo "Running npm ci"
        npm ci
      displayName: 'npm ci'
      workingDirectory: '$(Build.SourcesDirectory)/shoppingwebsite.client'

    - script: |
        echo "Running npm run build"
        npm run build
      displayName: 'npm run build'
      workingDirectory: '$(Build.SourcesDirectory)/shoppingwebsite.client'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)/shoppingwebsite.client/dist'
        artifact: 'frontend-dist'

  - job: Build_Backend
    displayName: 'Build & Publish ShoppingWebsite (ASP.NET Core) & Database'
    dependsOn: Build_Frontend
    steps:
    - checkout: self
  
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restore NuGet Packages'
      inputs:
        command: restore
        projects: '**/ShoppingWebsite.Server/*.csproj'

    - task: VSBuild@1
      displayName: Build solution
      inputs:
        solution: '**/ShoppingWebsite.sln'
        msbuildArgs: '/p:Configuration=$(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Publish ShoppingWebsite.Server'
      inputs:
        command: publish
        projects: 'ShoppingWebsite.Server/ShoppingWebsite.Server.csproj'
        arguments: >
          --configuration $(buildConfiguration)
          --output $(Build.ArtifactStagingDirectory)/server-publish

    - task: VSBuild@1
      displayName: 'Build ShoppingWebsiteDb (DACPAC)'
      inputs:
        solution: 'ShoppingWebsiteDb/ShoppingWebsiteDb.sqlproj'
        msBuildArgs: '/p:Configuration=$(buildConfiguration) /p:OutDir=$(Build.ArtifactStagingDirectory)/db/'

    - task: PublishPipelineArtifact@1
      displayName: Publish Backend Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/server-publish'
        artifact: 'server-publish'

    - task: PublishPipelineArtifact@1
      displayName: Publish DACPAC Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/db'
        artifact: db-publish

# -------------------------------------------------------------
# 2. Build & Push Docker Image to ACR
# -------------------------------------------------------------
- stage: Container
  displayName: 'Build & Push Docker Image'
  dependsOn: Build
  jobs:
  - job: Build_Container
    displayName: 'Build & Push Container'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
  
    - task: AzureCLI@2
      displayName: 'Login to ACR & Build Image'
      inputs:
        azureSubscription: 'azure-rg-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Logging into ACR $(registryName)"
          az acr login --name $(registryName)

          echo "Building Docker image"
          docker build \
            -t $(registryName).azurecr.io/$(imageName):$(Build.BuildId) \
            -f $(Build.SourcesDirectory)/Dockerfile \
            $(Build.SourcesDirectory)

          echo "Pushing image to ACR"
          docker push $(registryName).azurecr.io/$(imageName):$(Build.BuildId)

# -------------------------------------------------------------
# 3. Deploy to Azure Container Apps with Key Vault Secret
# -------------------------------------------------------------
- stage: Deploy
  displayName: 'Deploy ShoppingWebsite to Container App'
  dependsOn: Container
  jobs:
    - job: Deploy_ContainerApp
      pool:
        vmImage: 'ubuntu-latest'
      steps:
      - task: AzureCLI@2
        displayName: 'Register Microsoft.App provider if needed'
        inputs:
          azureSubscription: 'azure-rg-connection'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            echo "Checking Microsoft.App provider registration"
            state=$(az provider show --n Microsoft.App --query "registrationState" -o tsv)

            if [ "$state" != "Registered" ]; then
              echo "Registering Microsoft.App provider"
              az provider register -n Microsoft.App --wait
            else
              echo "Microsoft.App provider already registered"
            fi
      
      - task : AzureCLI@2
        displayName: 'Deploy Container App'
        inputs:
          azureSubscription: 'azure-rg-connection'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail

            echo "Updating Container App image and configuring Key Vault secret reference"

            az upgrade --yes
            az extension remove --name containerapp || true
            az extension add --name containerapp --upgrade --yes || true

            echo "Setting Key Vault secret reference in Container App"
            az containerapp secret set \
                --name $(containerAppName) \
                --resource-group $(resourceGroup) \
                --secrets $(secretName)=keyvaultref:https://$(vaultName).vault.azure.net/secrets/$(secretName),identityref:system

            az containerapp update \
                --name $(containerAppName) \
                --resource-group $(resourceGroup) \
                --image $(registryName).azurecr.io/$(imageName):$(Build.BuildId) \
                --ingress external \
                --target-port 80 \
                --set-env-vars ConnectionStrings__DefaultConnection=secretref:$(secretName)